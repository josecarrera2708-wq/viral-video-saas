services:
  millonary:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: millonary-paper
    restart: unless-stopped
    environment:
      MILLONARY_DATA: /data
      # Opcional: avisos por Telegram (créalos con @BotFather; déjalos vacíos si no los quieres)
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT: ${TELEGRAM_CHAT:-}
    volumes:
      - ./live_data:/data
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
