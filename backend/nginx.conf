user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8000;
        
        location / {
            default_type application/json;
            return 200 '{"status":"healthy","app":"Viral Video SaaS","version":"1.0.0"}';
        }
        
        location /health {
            return 200 'OK';
        }
    }
}
